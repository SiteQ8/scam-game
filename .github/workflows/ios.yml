name: ios

# Builds the iPhone app signed for the App Store, with its version and build number from package.json.
# * A tag such as ios-v1.1.0, and runs by hand: the signed app, uploaded to App Store Connect for TestFlight.
# * Called by release.yml for a release such as v1.1.0: the signed app, attached to that GitHub release
#   as scam-game-v1.1.0.ipa and uploaded to App Store Connect for TestFlight.
# Without the signing secrets nothing is signed, and without the App Store Connect API key nothing is
# uploaded: the run stays green and a notice names the missing secrets. store/SECRETS.md explains each one.
on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: The GitHub release to build, attach the app to and upload, for example v1.1.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and sign
    runs-on: macos-26
    outputs:
      signed: ${{ steps.export.outputs.signed }}
      file: ${{ steps.export.outputs.file }}
      upload: ${{ steps.check.outputs.upload }}
      bundle_id: ${{ steps.install.outputs.bundle_id }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release is built from its tag, also when the run was started by hand on main.
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || '' }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version from package.json
        id: version
        env:
          TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          # The app version is the version in package.json. The build number (Android versionCode,
          # iPhone CURRENT_PROJECT_VERSION) is major * 10000 + minor * 100 + patch, so 1.1.0 builds 10100
          # and a later version always has a higher number. android.yml has this same step.
          VERSION=$(node -p "require('./package.json').version")
          if ! echo "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$'; then
            echo "::error::package.json has version $VERSION. Use major.minor.patch with minor and patch from 0 to 99, for example 1.1.0."
            exit 1
          fi
          if [ -n "$TAG" ] && [ "${TAG##*v}" != "$VERSION" ]; then
            echo "::error::The tag $TAG does not match version $VERSION in package.json at that commit. Set the version in package.json to ${TAG##*v} before tagging, or build a tag that matches $VERSION."
            exit 1
          fi
          MAJOR=$(echo "$VERSION" | cut -d . -f 1)
          MINOR=$(echo "$VERSION" | cut -d . -f 2)
          PATCH=$(echo "$VERSION" | cut -d . -f 3)
          BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version $VERSION, build number $BUILD_NUMBER"
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "name=${GITHUB_REPOSITORY#*/}-${TAG:-v$VERSION}"
          } >> "$GITHUB_OUTPUT"
      - name: Check the secrets
        id: check
        env:
          IOS_CERT_P12_SET: ${{ secrets.IOS_CERT_P12 != '' }}
          IOS_CERT_PASSWORD_SET: ${{ secrets.IOS_CERT_PASSWORD != '' }}
          IOS_PROFILE_SET: ${{ secrets.IOS_PROFILE != '' }}
          ASC_KEY_ID_SET: ${{ secrets.ASC_KEY_ID != '' }}
          ASC_ISSUER_ID_SET: ${{ secrets.ASC_ISSUER_ID != '' }}
          ASC_KEY_P8_SET: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          # A missing secret skips what needs it and leaves a notice; it never fails the run.
          missing=""
          [ "$IOS_CERT_P12_SET" = true ] || missing="$missing IOS_CERT_P12"
          [ "$IOS_CERT_PASSWORD_SET" = true ] || missing="$missing IOS_CERT_PASSWORD"
          [ "$IOS_PROFILE_SET" = true ] || missing="$missing IOS_PROFILE"
          if [ -n "$missing" ]; then
            echo "::notice title=iPhone app not signed::No signed app was made, attached or uploaded. Missing repository secrets:$missing. See store/SECRETS.md."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
          missing=""
          [ "$ASC_KEY_ID_SET" = true ] || missing="$missing ASC_KEY_ID"
          [ "$ASC_ISSUER_ID_SET" = true ] || missing="$missing ASC_ISSUER_ID"
          [ "$ASC_KEY_P8_SET" = true ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight upload skipped::The app was not uploaded to App Store Connect. Missing repository secrets:$missing. See store/SECRETS.md."
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the web app into the iPhone project
        if: steps.check.outputs.sign == 'true'
        run: npm ci && npm run build && npx cap sync ios
      - name: Install the certificate and the profile
        id: install
        if: steps.check.outputs.sign == 'true'
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          BUNDLE_ID=$(node -p "require('./brand.json').appId")
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! printf '%s' "$IOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"; then
            echo "::error::IOS_CERT_P12 is not base64 text. See store/SECRETS.md."
            exit 1
          fi
          if ! security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"; then
            echo "::error::IOS_CERT_P12 does not open with IOS_CERT_PASSWORD. See store/SECRETS.md."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY_LINE=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -E '"(Apple|iPhone) Distribution' | head -n 1)
          if [ -z "$IDENTITY_LINE" ]; then
            security find-identity -p codesigning "$KEYCHAIN"
            echo "::error::IOS_CERT_P12 holds no valid Apple Distribution certificate with its private key. See store/SECRETS.md."
            exit 1
          fi
          IDENTITY_SHA=$(echo "$IDENTITY_LINE" | awk '{ print $2 }')
          IDENTITY=$(echo "$IDENTITY_LINE" | sed 's/^[^"]*"//; s/"$//')

          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          if ! printf '%s' "$IOS_PROFILE" | base64 --decode > "$PROFILE"; then
            echo "::error::IOS_PROFILE is not base64 text. See store/SECRETS.md."
            exit 1
          fi
          if ! security cms -D -i "$PROFILE" > "$PROFILE_PLIST"; then
            echo "::error::IOS_PROFILE is not a provisioning profile. See store/SECRETS.md."
            exit 1
          fi
          PROFILE_UUID=$(plutil -extract UUID raw -o - "$PROFILE_PLIST")
          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")
          PROFILE_APP_ID=$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")
          if [ "$PROFILE_APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::IOS_PROFILE is for the App ID $PROFILE_APP_ID, but brand.json has the bundle id $BUNDLE_ID. Make an App Store Connect profile for $BUNDLE_ID. See store/SECRETS.md."
            exit 1
          fi
          if plutil -extract ProvisionedDevices xml1 -o - "$PROFILE_PLIST" > /dev/null 2>&1; then
            echo "::error::IOS_PROFILE is a development or ad hoc profile. Make an App Store Connect distribution profile. See store/SECRETS.md."
            exit 1
          fi
          # Xcode 16 and later read profiles from the second folder, older versions from the first.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "signing $BUNDLE_ID for team $TEAM_ID with $IDENTITY and the profile $PROFILE_UUID"
          {
            echo "bundle_id=$BUNDLE_ID"
            echo "team_id=$TEAM_ID"
            echo "identity=$IDENTITY"
            echo "identity_sha=$IDENTITY_SHA"
            echo "profile_uuid=$PROFILE_UUID"
          } >> "$GITHUB_OUTPUT"
      - name: Sign the App target by hand
        if: steps.check.outputs.sign == 'true'
        env:
          BUNDLE_ID: ${{ steps.install.outputs.bundle_id }}
          TEAM_ID: ${{ steps.install.outputs.team_id }}
          IDENTITY: ${{ steps.install.outputs.identity }}
          PROFILE_UUID: ${{ steps.install.outputs.profile_uuid }}
        run: |
          # Signing settings given to xcodebuild on the command line reach the Swift package targets too,
          # and those take no provisioning profile. So they go into the App target's own Debug and Release
          # settings, on this runner only, together with the bundle id from brand.json.
          PROJECT=ios/App/App.xcodeproj/project.pbxproj
          perl -pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $ENV{TEAM_ID}; CODE_SIGN_IDENTITY = "$ENV{IDENTITY}"; PROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_UUID}";/; s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $ENV{BUNDLE_ID};/' "$PROJECT"
          if [ "$(grep -c "PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_UUID\";" "$PROJECT")" -ne 2 ]; then
            echo "::error::$PROJECT no longer has CODE_SIGN_STYLE = Automatic in the Debug and Release settings of the App target, so manual signing could not be set. Update this step."
            exit 1
          fi
      - name: Archive
        if: steps.check.outputs.sign == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
      - name: Export the IPA for App Store Connect
        id: export
        if: steps.check.outputs.sign == 'true'
        env:
          BUNDLE_ID: ${{ steps.install.outputs.bundle_id }}
          TEAM_ID: ${{ steps.install.outputs.team_id }}
          IDENTITY_SHA: ${{ steps.install.outputs.identity_sha }}
          PROFILE_UUID: ${{ steps.install.outputs.profile_uuid }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingCertificate</key>
            <string>$IDENTITY_SHA</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$OPTIONS"
          xcodebuild -quiet -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$OPTIONS"
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$IPA" ]; then
            echo "::error::The export made no IPA."
            exit 1
          fi
          # Check what the stores will read from the exported app.
          mkdir -p "$RUNNER_TEMP/check" "$RUNNER_TEMP/release"
          unzip -q "$IPA" -d "$RUNNER_TEMP/check"
          APP=$(find "$RUNNER_TEMP/check/Payload" -maxdepth 1 -name '*.app' | head -n 1)
          codesign --verify --deep --strict "$APP"
          expect() {
            value=$(plutil -extract "$1" raw -o - "$APP/Info.plist")
            if [ "$value" != "$2" ]; then
              echo "::error::The exported app has $1 $value instead of $2."
              exit 1
            fi
          }
          expect CFBundleIdentifier "$BUNDLE_ID"
          expect CFBundleShortVersionString "$VERSION"
          expect CFBundleVersion "$BUILD_NUMBER"
          cp "$IPA" "$RUNNER_TEMP/release/$NAME.ipa"
          echo "file=$NAME.ipa" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.export.outputs.signed == 'true'
        with:
          name: ios-release-ipa
          path: ${{ runner.temp }}/release/${{ steps.export.outputs.file }}
          if-no-files-found: error
          overwrite: true
      - name: Remove the signing keychain
        if: always() && steps.install.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.install.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

  attach:
    name: Attach to the release
    needs: build
    if: inputs.release_tag != '' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-release-ipa
          path: release
      - name: Attach the app to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag }}
          FILE: release/${{ needs.build.outputs.file }}
        run: gh release upload "$TAG" "$FILE" --clobber

  testflight:
    name: Upload to TestFlight
    needs: build
    if: needs.build.outputs.signed == 'true' && needs.build.outputs.upload == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-release-ipa
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the app and this build in App Store Connect
        id: asc
        shell: node {0}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: |
          // The upload names the app by its Apple ID, which App Store Connect gives for the bundle id.
          // A build number can be uploaded only once, so a build that is already there is not sent again.
          const { sign } = require('node:crypto');
          const { appendFileSync } = require('node:fs');
          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, BUNDLE_ID, VERSION, BUILD_NUMBER, GITHUB_OUTPUT } = process.env;
          const fail = (message) => {
            console.log(`::error::${message} See store/SECRETS.md.`);
            process.exit(1);
          };
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const claims = encode({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }) + '.' + encode({ iss: ASC_ISSUER_ID, iat: now, exp: now + 900, aud: 'appstoreconnect-v1' });
          let token = '';
          try {
            token = claims + '.' + sign('sha256', Buffer.from(claims), { key: ASC_KEY_P8, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          } catch {
            fail('ASC_KEY_P8 is not the private key of a .p8 file. Paste the whole file, from its BEGIN PRIVATE KEY line to its END PRIVATE KEY line.');
          }
          const get = async (path) => {
            const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + path, { headers: { Authorization: 'Bearer ' + token } });
            if (response.status === 401) fail('App Store Connect refused the API key. Check ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8.');
            if (!response.ok) fail('App Store Connect answered ' + response.status + ' to ' + path.split('?')[0] + ': ' + (await response.text()));
            return response.json();
          };
          (async () => {
            const apps = await get('apps?filter[bundleId]=' + BUNDLE_ID + '&limit=200');
            const app = apps.data.find((item) => item.attributes.bundleId === BUNDLE_ID);
            if (!app) fail('App Store Connect has no app with the bundle id ' + BUNDLE_ID + ' that this API key can see.');
            const builds = await get('builds?filter[app]=' + app.id + '&filter[version]=' + BUILD_NUMBER + '&filter[preReleaseVersion.version]=' + VERSION + '&limit=1');
            const state = builds.data.length > 0 ? builds.data[0].attributes.processingState : '';
            console.log('App Store Connect app ' + app.id + ', build ' + BUILD_NUMBER + ' of version ' + VERSION + ': ' + (state || 'not uploaded yet'));
            appendFileSync(GITHUB_OUTPUT, 'apple_id=' + app.id + '\nstate=' + state + '\n');
          })();
      - name: Upload to App Store Connect
        if: steps.asc.outputs.state == ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_ID: ${{ steps.asc.outputs.apple_id }}
          BUNDLE_ID: ${{ needs.build.outputs.bundle_id }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          FILE: release/${{ needs.build.outputs.file }}
        run: |
          # altool finds the key as AuthKey_<key id>.p8 in this folder.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-package "$FILE" --type ios --apple-id "$APPLE_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-short-version-string "$VERSION" --bundle-version "$BUILD_NUMBER" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          echo "::notice title=Uploaded to App Store Connect::Build $BUILD_NUMBER of version $VERSION appears in TestFlight once Apple has processed it."
      - name: Build already in App Store Connect
        if: steps.asc.outputs.state != ''
        env:
          STATE: ${{ steps.asc.outputs.state }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        run: |
          if [ "$STATE" = INVALID ] || [ "$STATE" = FAILED ]; then
            echo "::error::App Store Connect already has build $BUILD_NUMBER of version $VERSION, and it failed processing. Fix the problem from Apple's email, raise the patch version in package.json and publish that release."
            exit 1
          fi
          echo "::notice title=TestFlight upload skipped::App Store Connect already has build $BUILD_NUMBER of version $VERSION ($STATE), so it was not uploaded again."
